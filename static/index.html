<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>Life Changing Task</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link
  href="https://fonts.googleapis.com/css2?family=Anton&family=Inter:wght@400;500;600;700&display=swap"
  rel="stylesheet"
/>
<style>
  :root {
    --ink: #15140f;
    --paper: #f3efe3;
    --paper-2: #e9e4d3;
    --red: #e8432e;
    --green: #2f6b46;
    --line: #d8d1ba;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', -apple-system, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .headline { font-family: 'Anton', sans-serif; letter-spacing: 0.01em; }
  .topbar { background: var(--ink); color: var(--paper); padding: 18px 20px 16px; }
  .topbar h1 { margin: 0; font-size: 22px; line-height: 1.05; }
  .topbar .sub { margin-top: 6px; font-size: 13px; color: #cfc9b6; }

  .tabs { display: flex; background: var(--paper-2); border-bottom: 1px solid var(--line); }
  .tab {
    flex: 1; text-align: center; padding: 12px 4px; font-size: 13px; font-weight: 600;
    color: #6b6656; border-bottom: 3px solid transparent; cursor: pointer;
  }
  .tab.active { color: var(--ink); border-bottom-color: var(--red); }
  .screen { display: none; padding: 16px 16px 100px; }
  .screen.active { display: block; }

  .day-badge {
    display: inline-block; font-size: 12px; font-weight: 700; background: var(--ink);
    color: var(--paper); padding: 3px 10px; border-radius: 3px; margin-bottom: 12px;
  }

  .task-row {
    display: flex; align-items: center; gap: 12px; padding: 12px 4px;
    border-bottom: 1px solid var(--line); cursor: pointer; user-select: none;
  }
  .task-row:last-child { border-bottom: none; }
  .task-box { flex-shrink: 0; width: 34px; height: 34px; border: 2px solid var(--ink); position: relative; background: transparent; }
  .task-box::after {
    content: ''; position: absolute; inset: 0;
    background: linear-gradient(to top left, transparent calc(50% - 0.5px), var(--ink) calc(50% - 0.5px), var(--ink) calc(50% + 0.5px), transparent calc(50% + 0.5px));
  }
  .task-row.done .task-box { background: var(--ink); }
  .task-row.done .task-box::after { display: none; }
  .task-emoji { font-size: 18px; width: 26px; text-align: center; flex-shrink: 0; }
  .task-text { flex: 1; min-width: 0; }
  .task-title { font-size: 15px; font-weight: 600; }
  .task-hint { font-size: 12px; color: #6b6656; margin-top: 1px; }

  .save-bar {
    position: sticky; bottom: 0; left: 0; right: 0; background: var(--paper);
    border-top: 1px solid var(--line); padding: 12px 16px 18px;
  }
  .save-btn {
    width: 100%; background: var(--ink); color: var(--paper); border: none; padding: 14px 0;
    font-family: 'Inter', sans-serif; font-size: 15px; font-weight: 700; letter-spacing: 0.02em; cursor: pointer;
  }
  .save-btn:active { opacity: 0.85; }
  .save-btn.saved { background: var(--green); }

  .stats-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 18px; }
  .stat-card { background: var(--paper-2); border: 1px solid var(--line); padding: 12px; }
  .stat-num { font-family: 'Anton', sans-serif; font-size: 26px; line-height: 1; }
  .stat-label { font-size: 11px; color: #6b6656; margin-top: 4px; text-transform: uppercase; letter-spacing: 0.03em; }

  .pct-row { display: flex; align-items: center; gap: 10px; padding: 7px 0; }
  .pct-emoji { width: 22px; text-align: center; font-size: 15px; }
  .pct-title { flex: 1; font-size: 13px; }
  .pct-bar-track { width: 90px; height: 8px; background: var(--paper-2); border: 1px solid var(--line); }
  .pct-bar-fill { height: 100%; background: var(--ink); }
  .pct-value { width: 34px; text-align: right; font-size: 12px; font-weight: 600; }

  .grid-wrap { overflow-x: auto; -webkit-overflow-scrolling: touch; margin-top: 6px; }
  .heatmap { border-collapse: collapse; }
  .heatmap th, .heatmap td { padding: 0; }
  .heatmap th { font-size: 14px; width: 22px; text-align: center; padding-bottom: 4px; }
  .heatmap .wk-label { font-size: 10px; color: #6b6656; padding-right: 6px; text-align: right; white-space: nowrap; }
  .cell { width: 18px; height: 14px; border: 1px solid var(--paper); }

  .section-title { font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.04em; color: #6b6656; margin: 20px 0 8px; }
  .empty-note { font-size: 13px; color: #6b6656; line-height: 1.5; padding: 20px 0; }

  /* --- Мои задачи --- */
  .edit-row {
    display: flex; align-items: center; gap: 10px; padding: 10px 4px; border-bottom: 1px solid var(--line);
  }
  .edit-row:last-child { border-bottom: none; }
  .edit-row .task-emoji { width: 24px; }
  .edit-row .task-text { flex: 1; min-width: 0; }
  .edit-actions { display: flex; gap: 6px; flex-shrink: 0; }
  .icon-btn {
    width: 30px; height: 30px; border: 1px solid var(--line); background: var(--paper-2);
    display: flex; align-items: center; justify-content: center; font-size: 14px; cursor: pointer; flex-shrink: 0;
  }
  .icon-btn.danger { color: var(--red); }

  .form-box { background: var(--paper-2); border: 1px solid var(--line); padding: 12px; margin-top: 10px; }
  .form-box .row { display: flex; gap: 8px; margin-bottom: 8px; }
  .form-box input {
    font-family: 'Inter', sans-serif; font-size: 14px; padding: 9px 10px; border: 1px solid var(--line);
    background: var(--paper); color: var(--ink); width: 100%;
  }
  .form-box input.emoji-input { width: 54px; flex: none; text-align: center; }
  .form-box .btn-row { display: flex; gap: 8px; }
  .form-box button {
    font-family: 'Inter', sans-serif; font-size: 13px; font-weight: 700; padding: 9px 14px; border: none; cursor: pointer;
  }
  .btn-primary { background: var(--ink); color: var(--paper); flex: 1; }
  .btn-cancel { background: transparent; color: var(--ink); border: 1px solid var(--line) !important; }
  .add-btn {
    width: 100%; margin-top: 12px; padding: 12px 0; background: transparent; border: 2px dashed var(--line);
    color: #6b6656; font-family: 'Inter', sans-serif; font-size: 14px; font-weight: 600; cursor: pointer;
  }
  .field-error { color: var(--red); font-size: 12px; margin: -4px 0 8px; }
  .limit-note { font-size: 12px; color: #6b6656; margin-top: 10px; }
</style>
</head>
<body>

<div class="topbar">
  <h1 class="headline" id="dayHeader">LIFE CHANGING TASK</h1>
  <div class="sub" id="dayIndicator">Загрузка…</div>
</div>

<div class="tabs">
  <div class="tab active" data-screen="today">Сегодня</div>
  <div class="tab" data-screen="progress">Прогресс</div>
  <div class="tab" data-screen="edit">Мои задачи</div>
</div>

<div class="screen active" id="screen-today">
  <div class="day-badge" id="todayDate">—</div>
  <div id="taskList"></div>
</div>

<div class="screen" id="screen-progress">
  <div class="stats-grid" id="statsGrid"></div>
  <div class="section-title">По задачам</div>
  <div id="pctList"></div>
  <div class="section-title">Недели</div>
  <div class="grid-wrap"><table class="heatmap" id="heatmapTable"></table></div>
</div>

<div class="screen" id="screen-edit">
  <div id="editList"></div>
  <button class="add-btn" id="addTaskBtn">+ Добавить задачу</button>
  <div class="limit-note" id="limitNote"></div>
  <div id="formSlot"></div>
</div>

<div class="save-bar" id="saveBar">
  <button class="save-btn" id="saveBtn">Сохранить</button>
</div>

<script>
const tg = window.Telegram && window.Telegram.WebApp;
if (tg) { tg.ready(); tg.expand(); }
const initData = tg ? tg.initData : '';

let state = null;
let todayStates = {};

async function apiGet(path) {
  const res = await fetch(path);
  return { ok: res.ok, data: await res.json().catch(() => ({})) };
}
async function apiPost(path, body) {
  const res = await fetch(path, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify(body),
  });
  return { ok: res.ok, data: await res.json().catch(() => ({})) };
}

async function loadState() {
  const { ok, data } = await apiGet('/api/state?initData=' + encodeURIComponent(initData));
  if (!ok) {
    document.getElementById('taskList').innerHTML =
      '<div class="empty-note">Не удалось загрузить данные. Открой приложение через кнопку в боте (не напрямую по ссылке).</div>';
    return;
  }
  state = data;
  todayStates = { ...state.today_states };
  render();
}

function render() {
  if (!state) return;
  const p = state.progress;
  document.getElementById('dayIndicator').textContent =
    `День ${p.days_elapsed} из ${p.total_days} · Неделя ${p.current_week} из ${p.total_weeks}`;
  document.getElementById('todayDate').textContent = state.today;
  renderTaskList();
  renderProgress();
  renderEditList();
  updateSaveBarVisibility();
}

function updateSaveBarVisibility() {
  const activeScreen = document.querySelector('.screen.active').id;
  document.getElementById('saveBar').style.display = activeScreen === 'screen-today' ? 'block' : 'none';
}

function renderTaskList() {
  const container = document.getElementById('taskList');
  container.innerHTML = '';
  if (!state.tasks.length) {
    container.innerHTML = '<div class="empty-note">Список задач пуст. Добавь свои во вкладке «Мои задачи».</div>';
    return;
  }
  state.tasks.forEach(task => {
    const done = !!todayStates[task.task_key];
    const row = document.createElement('div');
    row.className = 'task-row' + (done ? ' done' : '');
    row.innerHTML = `
      <div class="task-box"></div>
      <div class="task-emoji">${task.emoji}</div>
      <div class="task-text">
        <div class="task-title">${escapeHtml(task.title)}</div>
        ${task.hint ? `<div class="task-hint">${escapeHtml(task.hint)}</div>` : ''}
      </div>
    `;
    row.addEventListener('click', () => {
      todayStates[task.task_key] = !todayStates[task.task_key];
      row.classList.toggle('done', !!todayStates[task.task_key]);
      resetSaveButton();
    });
    container.appendChild(row);
  });
}

function renderProgress() {
  const p = state.progress;
  const statsGrid = document.getElementById('statsGrid');
  statsGrid.innerHTML = `
    <div class="stat-card"><div class="stat-num">${p.current_week}/${p.total_weeks}</div><div class="stat-label">Неделя</div></div>
    <div class="stat-card"><div class="stat-num">${p.perfect_days}</div><div class="stat-label">Идеальных дней</div></div>
  `;

  const pctList = document.getElementById('pctList');
  pctList.innerHTML = '';
  state.tasks.forEach(task => {
    const pct = p.per_task_pct[task.task_key] || 0;
    const row = document.createElement('div');
    row.className = 'pct-row';
    row.innerHTML = `
      <div class="pct-emoji">${task.emoji}</div>
      <div class="pct-title">${escapeHtml(task.title)}</div>
      <div class="pct-bar-track"><div class="pct-bar-fill" style="width:${pct}%"></div></div>
      <div class="pct-value">${pct}%</div>
    `;
    pctList.appendChild(row);
  });

  const table = document.getElementById('heatmapTable');
  if (!p.weekly_grid.length || !state.tasks.length) {
    table.innerHTML = '';
    return;
  }
  let thead = '<tr><th></th>' + state.tasks.map(t => `<th>${t.emoji}</th>`).join('') + '</tr>';
  let rows = p.weekly_grid.map(w => {
    const cells = state.tasks.map(t => {
      const v = w.tasks[t.task_key] || 0;
      return `<td><div class="cell" style="background:${cellColor(v)}"></div></td>`;
    }).join('');
    return `<tr><td class="wk-label">Нед ${w.week}</td>${cells}</tr>`;
  }).join('');
  table.innerHTML = thead + rows;
}

function cellColor(pct) {
  if (pct <= 0) return '#e9e4d3';
  if (pct < 40) return '#cdbfa0';
  if (pct < 80) return '#8a7a55';
  return '#15140f';
}

function resetSaveButton() {
  const btn = document.getElementById('saveBtn');
  btn.textContent = 'Сохранить';
  btn.classList.remove('saved');
}

function escapeHtml(str) {
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

document.getElementById('saveBtn').addEventListener('click', async () => {
  const btn = document.getElementById('saveBtn');
  btn.textContent = 'Сохраняю…';
  const { ok, data } = await apiPost('/api/checkin', { initData, states: todayStates });
  if (ok && data.ok) {
    state.progress = data.progress;
    renderProgress();
    btn.textContent = 'Сохранено ✓';
    btn.classList.add('saved');
    if (tg && tg.HapticFeedback) tg.HapticFeedback.notificationOccurred('success');
  } else {
    btn.textContent = 'Ошибка, попробуй ещё раз';
  }
});

document.querySelectorAll('.tab').forEach(tab => {
  tab.addEventListener('click', () => {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    tab.classList.add('active');
    document.getElementById('screen-' + tab.dataset.screen).classList.add('active');
    closeForm();
    updateSaveBarVisibility();
  });
});

/* ---------------- Мои задачи ---------------- */

function renderEditList() {
  const container = document.getElementById('editList');
  container.innerHTML = '';
  state.tasks.forEach(task => {
    const row = document.createElement('div');
    row.className = 'edit-row';
    row.innerHTML = `
      <div class="task-emoji">${task.emoji}</div>
      <div class="task-text">
        <div class="task-title">${escapeHtml(task.title)}</div>
        ${task.hint ? `<div class="task-hint">${escapeHtml(task.hint)}</div>` : ''}
      </div>
      <div class="edit-actions">
        <div class="icon-btn edit-icon" title="Изменить">✎</div>
        <div class="icon-btn danger delete-icon" title="Удалить">✕</div>
      </div>
    `;
    row.querySelector('.edit-icon').addEventListener('click', () => openEditForm(task));
    row.querySelector('.delete-icon').addEventListener('click', () => deleteTask(task.task_key));
    container.appendChild(row);
  });

  const atLimit = state.tasks.length >= state.max_tasks;
  document.getElementById('addTaskBtn').style.display = atLimit ? 'none' : 'block';
  document.getElementById('limitNote').textContent = atLimit
    ? `Достигнут максимум задач (${state.max_tasks}). Удали одну, чтобы добавить другую.`
    : `Можно добавить ещё ${state.max_tasks - state.tasks.length} задач(и).`;
}

function closeForm() {
  document.getElementById('formSlot').innerHTML = '';
}

function openAddForm() {
  renderForm({ mode: 'add' });
}

function openEditForm(task) {
  renderForm({ mode: 'edit', task });
}

function renderForm({ mode, task }) {
  const slot = document.getElementById('formSlot');
  const emojiVal = task ? task.emoji : '';
  const titleVal = task ? task.title : '';
  const hintVal = task ? task.hint : '';

  slot.innerHTML = `
    <div class="form-box">
      <div class="row">
        <input type="text" class="emoji-input" id="f-emoji" maxlength="4" placeholder="⭐" value="${escapeHtml(emojiVal)}" />
        <input type="text" id="f-title" maxlength="60" placeholder="Название задачи" value="${escapeHtml(titleVal)}" />
      </div>
      <div class="row">
        <input type="text" id="f-hint" maxlength="80" placeholder="Пояснение (необязательно)" value="${escapeHtml(hintVal)}" />
      </div>
      <div class="field-error" id="f-error" style="display:none;"></div>
      <div class="btn-row">
        <button class="btn-primary" id="f-save">${mode === 'add' ? 'Добавить' : 'Сохранить'}</button>
        <button class="btn-cancel" id="f-cancel">Отмена</button>
      </div>
    </div>
  `;

  document.getElementById('f-cancel').addEventListener('click', closeForm);
  document.getElementById('f-save').addEventListener('click', async () => {
    const title = document.getElementById('f-title').value.trim();
    const emoji = document.getElementById('f-emoji').value.trim();
    const hint = document.getElementById('f-hint').value.trim();
    const errorEl = document.getElementById('f-error');

    if (!title) {
      errorEl.textContent = 'Впиши название задачи';
      errorEl.style.display = 'block';
      return;
    }
    errorEl.style.display = 'none';

    let result;
    if (mode === 'add') {
      result = await apiPost('/api/tasks/add', { initData, title, emoji, hint });
    } else {
      result = await apiPost('/api/tasks/edit', { initData, task_key: task.task_key, title, emoji, hint });
    }

    if (result.ok && result.data.ok) {
      state.tasks = result.data.tasks;
      closeForm();
      renderEditList();
      renderTaskList();
      renderProgress();
    } else if (result.data.error === 'limit_reached') {
      errorEl.textContent = `Максимум ${state.max_tasks} задач — сначала удали одну`;
      errorEl.style.display = 'block';
    } else {
      errorEl.textContent = 'Не получилось сохранить, попробуй ещё раз';
      errorEl.style.display = 'block';
    }
  });

  slot.scrollIntoView({ behavior: 'smooth', block: 'end' });
}

async function deleteTask(taskKey) {
  const result = await apiPost('/api/tasks/delete', { initData, task_key: taskKey });
  if (result.ok && result.data.ok) {
    state.tasks = result.data.tasks;
    Object.keys(todayStates).forEach(k => { if (k === taskKey) delete todayStates[k]; });
    renderEditList();
    renderTaskList();
    renderProgress();
  }
}

document.getElementById('addTaskBtn').addEventListener('click', openAddForm);

loadState();
</script>
</body>
</html>
